name: Daily Supabase Backup

on:
  # Tiap hari jam 03:00 WIB (= 20:00 UTC) supaya tidak bentrok dengan traffic puncak
  schedule:
    - cron: '0 20 * * *'
  # Bisa trigger manual dari tab Actions
  workflow_dispatch:

# Supaya job bisa push balik ke repo (untuk commit file backup)
permissions:
  contents: write
  issues: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run backup script
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: node scripts/backup-supabase.mjs

      - name: Commit & push backup file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backups/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(backup): snapshot $(date -u +%Y-%m-%d_%H%M%S)"
            git push
          fi

      - name: Cleanup old backups (>30 hari)
        run: |
          find backups/ -name "*.json" -type f -mtime +30 -delete || true

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            // fs.readFileSync is synchronous — wrap in try/catch, NOT .catch()
            const fs = require('fs');
            let log = 'tidak ada backup-error.log';
            try {
              log = fs.readFileSync('backup-error.log', 'utf8');
            } catch (e) {
              log = 'backup-error.log tidak ditemukan. Lihat tab Actions untuk detail.';
            }
            try {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '⚠️ Supabase backup gagal - ' + new Date().toISOString().substring(0, 10),
                body: 'Daily backup workflow gagal. Lihat log:\n\n```\n' + log + '\n```',
                labels: ['backup', 'bug'],
              });
            } catch (issueErr) {
              core.warning('Gagal buat issue: ' + issueErr.message);
            }
