name: CI — TypeScript + Playwright smoke

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Don't run multiple in parallel; cancel in-progress on new push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: TypeScript compile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit --skipLibCheck

  unit:
    name: Vitest component tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high

  smoke:
    name: Playwright smoke (production)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [typecheck, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests against production
        # Don't enable mutation tests in CI by default — those mutate
        # production DB. Override with `gh workflow run ci.yml -f enable_mutations=true`
        # when you need a one-off full-suite run.
        run: npx playwright test tests/e2e/smoke.spec.ts --project=chromium

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  mutations:
    name: Playwright mutations (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [typecheck]
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[mutations]')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Run mutation suite
        env:
          RUN_MUTATION_TESTS: '1'
          TEST_SUPER_USER: andreas
          # Use a GitHub Actions secret for the test super password.
          TEST_SUPER_PASS: ${{ secrets.TEST_SUPER_PASS }}
        run: npx playwright test tests/e2e/mutations.spec.ts --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mutations-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7